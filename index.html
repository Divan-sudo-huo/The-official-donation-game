<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divan's Donation Game</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080b08;
    color: #22c55e;
    font-family: "Courier New", monospace;
}

.game {
    width: 90%;
    max-width: 650px;
    padding: 30px;
    background: #0d120e;
    border: 1px solid #1f7a3a;
    border-radius: 14px;
    box-shadow: 0 0 35px rgba(34, 197, 94, 0.12);
}

h1 {
    font-size: 20px;
    margin-top: 0;
}

.money {
    margin: 20px 0;
}

.box {
    white-space: pre;
    margin-bottom: 20px;
    overflow-x: auto;
}

form {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #286d3b;
    background: #050705;
    color: #22c55e;
    font: inherit;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #061007;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4ade80;
}

#message {
    min-height: 50px;
    margin-top: 25px;
    color: white;
}

.error {
    color: #f87171 !important;
}

@media (max-width: 500px) {
    form {
        flex-direction: column;
    }
}
</style></head><body><main class="game"><h1>How much would you like to donate? -Divan</h1>

<div class="money">
    You have 50 dollars
</div>

<div class="box">╔══════════════════════╗

║ Enter: <span id="amount">0</span>              ║
╚══════════════════════╝</div>

<form id="donationForm">

    <input
        id="donation"
        type="number"
        min="0"
        step="1"
        value="0"
        aria-label="Donation amount"
    >

    <button type="submit">
        Donate
    </button>

</form>

<div id="message" aria-live="polite"></div>

</main><script>
const form = document.getElementById("donationForm");
const input = document.getElementById("donation");
const amount = document.getElementById("amount");
const message = document.getElementById("message");

input.addEventListener("input", () => {
    amount.textContent = input.value || "0";
});

form.addEventListener("submit", (event) => {

    event.preventDefault();

    const value = Number(input.value);

    message.classList.remove("error");

    if (input.value === "" || !Number.isInteger(value)) {

        message.textContent =
            "That is not a valid currency amount.";

        message.classList.add("error");

    } else if (value > 50) {

        message.textContent =
            "You don't have that much money brokey.";

    } else if (value === 50) {

        message.textContent =
            "Everything? You are great, thank you!.";

    } else if (value >= 10) {

        message.textContent =
            "Thank you!.";

    } else if (value >= 1) {

        message.textContent =
            "Yeh thanks...selfish brat....";

    } else {

        message.textContent =
            "You didn't even donate anything ...";
    }
});
</script></body>
  </html>
